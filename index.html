<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ====================== воксельная сетка ======================
// 1 воксель = 0,5 м. Оси: x — вдоль длинной стороны дома (на восток-северо-восток),
// z — на юг-юго-восток, y — вверх. Участок 130 × 120 м повёрнут на ~30°, чтобы дом стоял ровно по сетке.
const U0=64,V0=60,NX=260,NZ=240,NY=92,G=12;
const X=u=>Math.round((u+U0)*2), Z=v=>Math.round((V0-v)*2);
const vox=new Uint32Array(NX*NY*NZ);
const I=(x,y,z)=>x+NX*(z+NZ*y);
const inb=(x,y,z)=>x>=0&&x<NX&&y>=0&&y<NY&&z>=0&&z<NZ;
function h3(x,y,z){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1274126177);h=Math.imul(h^(h>>>13),1103515245);h^=h>>>16;return(h>>>0)/4294967296;}
function shade(c,f){const r=Math.min(255,((c>>16)&255)*f)|0,g=Math.min(255,((c>>8)&255)*f)|0,b=Math.min(255,(c&255)*f)|0;return(r<<16)|(g<<8)|b;}
function mix(a,b,t){const r=((a>>16)&255)*(1-t)+((b>>16)&255)*t,g=((a>>8)&255)*(1-t)+((b>>8)&255)*t,bl=(a&255)*(1-t)+(b&255)*t;return(r<<16)|(g<<8)|(bl|0);}
function put(x,y,z,c,j=0.06,fl=1){if(!inb(x,y,z))return;vox[I(x,y,z)]=((fl<<24)|shade(c,1+(h3(x,y,z)-.5)*2*j))>>>0;}
const get=(x,y,z)=>inb(x,y,z)?vox[I(x,y,z)]:0;
function putE(x,y,z,c,j,fl){if(inb(x,y,z)&&!vox[I(x,y,z)])put(x,y,z,c,j,fl);}
function del(x,y,z){if(inb(x,y,z))vox[I(x,y,z)]=0;}
function box(x1,x2,y1,y2,z1,z2,c,j,fl){for(let y=y1;y<y2;y++)for(let z=z1;z<z2;z++)for(let x=x1;x<x2;x++)put(x,y,z,c,j,fl);}
function vn(x,z,s){const fx=x/s,fz=z/s,ix=Math.floor(fx),iz=Math.floor(fz),tx=fx-ix,tz=fz-iz,sx=tx*tx*(3-2*tx),sz=tz*tz*(3-2*tz);
  const a=h3(ix,7,iz),b=h3(ix+1,7,iz),c=h3(ix,7,iz+1),d=h3(ix+1,7,iz+1);return a+(b-a)*sx+(c-a)*sz+(a-b-c+d)*sx*sz;}
function topY(x,z){for(let y=NY-1;y>=0;y--)if(get(x,y,z))return y;return -1;}
let seed=20261110;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const pick=(p,x,y,z)=>p[Math.floor(h3(x*3+1,y*5+2,z*7+3)*p.length)];

// ====================== времена года ======================
const tp=a=>{a.tree=true;return a;};
const SPR=[0x2F5D3A,0x2A5234,0x3A6B45],BLO=tp([0xF7C6D9,0xF9D9E6,0xF2A9C4,0xFFFFFF]),BARE=[0x5B4636,0x4A382B,0x6A5240],BAREP=tp([0x5B4636]);
const LEAFA=[0xF2C230,0xE8A317,0xF6D55C,0xD9A520,0xE67E22,0xD9731A,0xF39C12,0xC96A1B,0xC0392B,0x8E5A1E];
const SEAS={
 spring:{id:'spring',name:'весна',Y:tp([0xA8D65C,0x93C94E,0xB9E070,0x86BF45]),O:BLO,R:tp([0x7CC254,0x6BB347,0x8FD066,0x5FA53E]),POP:tp([0x9CCB5A,0x8ABF4C,0xAEDB6C]),LAR:tp([0x8FCB6B,0x7DBD5C,0xA2D97E]),APP:BLO,
   grassA:0x7FB34A,grassB:0xA3CF5E,dry:0x8A7A45,dryW:0.3,dots:[0xF4D03F,0xF4D03F,0xFFFFFF,0xF4D03F],dotP:0.035,tuft:0.006,puddle:0.72,
   sun:[0xFFF0D8,3.0,-190,270,180],hemi:[0xD6E8FF,0x7A8A58,1.05],smoke:0.5,cloud:0xffffff,
   part:{label:'Лепестки',cols:[0xF7C6D9,0xFFFFFF,0xF2A9C4],size:0.55,v:[1.2,2.6],drift:1.5,wind:1,n:260}},
 summer:{id:'summer',name:'лето',Y:tp([0x4FA83D,0x5DB548,0x43963A,0x6BBF4F]),O:tp([0x3E8E3A,0x4A9C40,0x357F33,0x58A848]),R:tp([0x2F7D3A,0x3A8A3F,0x4C9A45]),POP:tp([0x5BA84A,0x4E9A40,0x6DB85A]),LAR:tp([0x4F9E5A,0x5CAB62,0x458F50]),APP:tp([0x4FA83D,0x5DB548,0x43963A,0xD9412F]),
   grassA:0x4E9A3E,grassB:0x74B84C,dry:0x8FA046,dryW:0.25,dots:[0xFFFFFF,0xF4D03F,0xB07CD8,0xF29AC0],dotP:0.025,tuft:0.012,puddle:2,
   sun:[0xFFF6E0,3.5,-140,330,150],hemi:[0xCFE4FF,0x6F8A4A,1.1],smoke:0,cloud:0xffffff,
   part:{label:'Тополиный пух',cols:[0xFFFFFF,0xF4F4EE],size:0.5,v:[0.25,0.9],drift:4,wind:1.5,float:true,n:340}},
 autumn:{id:'autumn',name:'осень',Y:tp([0xF2C230,0xE8A317,0xF6D55C,0xD9A520]),O:tp([0xE67E22,0xD9731A,0xF39C12,0xC96A1B]),R:tp([0xC0392B,0xA83220,0xD35400,0x8E2A1E]),POP:tp([0xD8B93A,0xC9A227,0xB7B040,0xE3C54A]),LAR:tp([0xE0A030,0xD98E1F,0xC97B1A,0xEDB84A]),APP:tp([0x9FA63A,0xB8B040,0xC0392B,0xA9B03C]),
   grassA:0x748A3C,grassB:0xA69C40,dry:0x9A7A3C,dryW:0.8,dots:LEAFA,dotP:0.07,tuft:0.008,puddle:0.8,
   sun:[0xFFD7A6,3.2,-210,250,190],hemi:[0xC9DBFF,0x7A6248,1.0],smoke:1,cloud:0xE4E2E6,
   part:{label:'Листопад',cols:LEAFA,size:0.8,v:[2,5],drift:1.5,wind:0.5,n:420}},
 winter:{id:'winter',name:'зима',Y:BAREP,O:BAREP,R:BAREP,POP:BAREP,LAR:BAREP,APP:BAREP,snow:true,bare:true,
   grassA:0xF6F8FC,grassB:0xE4ECF5,dry:0xE4ECF5,dryW:0,dots:[0xFFFFFF],dotP:0,tuft:0,puddle:0.8,
   sun:[0xFFE6CC,2.5,-240,140,230],hemi:[0xDDE8FF,0xC8D4E8,1.2],smoke:1.2,cloud:0xD8DEE8,
   part:{label:'Снег',cols:[0xFFFFFF],size:0.5,v:[3,6],drift:2,wind:1.5,n:520}},
};
let SE=SEAS[new URLSearchParams(location.hash.slice(1)).get('s')]||SEAS.autumn,Y,O,R,POP,LAR,APP;
const lamps=[],chimneys=[];
function generate(){
vox.fill(0);seed=20261110;lamps.length=0;chimneys.length=0;({Y,O,R,POP,LAR,APP}=SE);

// ====================== земля ======================
const inR=(u,v,u1,u2,v1,v2)=>u>=u1&&u<u2&&v>=v1&&v<v2;
function terrain(u,v){
  const zs=-10-(u-31)*0.095;                       // ось улицы Зелёной
  if(u>=23.5&&u<30.5&&v<32) return 'road';         // проезд вдоль дома
  if(u>=30.5&&Math.abs(v-zs)<=3) return 'road';    // Зелёная улица
  if(u>=-34.5&&u<-28.5) return 'road';             // западный проезд
  if(inR(u,v,19.5,46,20,32)) return 'yard';        // парковка
  if(inR(u,v,30.5,33,-4,20)) return 'yard';
  if(inR(u,v,-28.5,23.5,8.6,19)) return 'yard';    // двор перед подъездами
  if(inR(u,v,-16.2,20.2,-13.3,8.6)) return 'concrete';
  if(inR(u,v,-58,-34.5,4,34.5)) return 'dirt';
  if(inR(u,v,27,38,34,60)) return 'tile';
  if(inR(u,v,44,57,1,16)) return 'rubber';
  if(inR(u,v,37,63,-3,20)) return 'sand';
  if(inR(u,v,-27.5,-6,-58,-19.5)) return 'soil';
  return 'grass';
}
for(let z=0;z<NZ;z++)for(let x=0;x<NX;x++){
  const u=x/2-U0+.25,v=V0-z/2-.25,t=terrain(u,v);
  const edge=Math.min(x,NX-1-x,z,NZ-1-z), ef=Math.min(1,edge/34), es=ef*ef*(3-2*ef);
  const yb=Math.max(0,Math.round(G-4-(1.5+6*es+2.5*vn(x,z,9))));
  for(let y=yb;y<G-3;y++){const band=Math.floor((y+3*vn(x+y*2,z,22))/2)%3;put(x,y,z,[0x8C8A93,0x77757F,0x9B99A2][band],0.05);}
  put(x,G-3,z,0x5E412B,0.08);put(x,G-2,z,0x6B4A2F,0.08);
  let c,j=0.07,pud=false;
  if(t==='grass'){const n=vn(x,z,20),n2=vn(x+300,z+90,6);c=mix(mix(SE.grassA,SE.grassB,n),SE.dry,n2*n2*SE.dryW);
    if(h3(x,1,z)<SE.dotP)c=pick(SE.dots,x,2,z);}
  else if(t==='road'){c=mix(0x8C8172,0x7A7064,vn(x,z,8));pud=vn(x+40,z+40,7)>SE.puddle;}
  else if(t==='yard'){c=mix(0x7E7B77,0x6E6C69,vn(x,z,10));pud=vn(x+90,z+10,6)>SE.puddle+0.03;}
  else if(t==='dirt')c=mix(0x8B7355,0x7A664C,vn(x,z,9));
  else if(t==='concrete')c=0xA9A59C;
  else if(t==='tile'){c=((x>>1)+(z>>1))&1?0xB8B0A2:0xA59D90;j=0.03;}
  else if(t==='rubber'){c=0xC8643C;j=0.04;}
  else if(t==='sand')c=0xD9B77A;
  else {c=(z%4<2)?0x5A4030:0x70553B;}
  if(pud){c=SE.snow?0xBFD8EA:0x5F7A92;j=0.02;}
  else if(SE.snow){const sn=mix(0xF6F8FC,0xDCE6F2,vn(x+70,z+20,14));
    if(t==='road'||t==='yard')c=mix(c,sn,0.5+0.3*vn(x,z,5));else if(t==='tile'||t==='concrete'||t==='rubber')c=mix(c,sn,0.75);else c=sn;j=0.025;}
  put(x,G-1,z,c,j);
  if(t==='soil'&&z%4<2){put(x,G,z,SE.snow?0xF2F5FA:0x5A4030,SE.snow?0.02:0.1);const r=h3(x,9,z);
    if(SE.id==='autumn'){if(r<0.012)put(x,G+1,z,0xE67E22,0.08);else if(r<0.035)put(x,G+1,z,0x7FAF6A,0.1);else if(r<0.05){put(x,G+1,z,0xB59A5A,0.1);put(x,G+2,z,0xC9AE66,0.1);}}
    else if(SE.id==='summer'){if(r<0.55)put(x,G+1,z,pick([0x4E9A3E,0x5FAE48,0x3F8A3A],x,4,z),0.1);
      if(r<0.03&&z%12<2){put(x,G+2,z,0x4E9A3E,0.05);put(x,G+3,z,0x4E9A3E,0.05);put(x,G+4,z,0xF4C430,0.05);}else if(r<0.1)put(x,G+2,z,0x4E9A3E,0.1);else if(r>0.97)put(x,G+2,z,0xD9412F,0.08);}
    else if(SE.id==='spring'){if(r<0.18)put(x,G+1,z,0x86C452,0.1);}}
  if(t==='grass'){const r=h3(x,3,z);
    if(SE.snow){const d=vn(x+11,z+37,7);if(d>0.7)put(x,G,z,0xF6F8FC,0.02);if(d>0.84)put(x,G+1,z,0xF6F8FC,0.02);}
    else if(r<SE.tuft)put(x,G,z,mix(SE.grassA,SE.grassB,h3(x,4,z)),0.1);else if(r<SE.tuft+SE.dotP*0.07)put(x,G,z,pick(SE.dots,x,5,z),0.1);}
}

// ====================== детали ======================
function litter(cx,cz,r,pal){if(SE.id==='winter'||SE.id==='summer'||(SE.id==='spring'&&pal!==BLO))return;for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){const d=Math.hypot(dx,dz)/r;if(d>1)continue;const x=cx+dx,z=cz+dz;
  if(!inb(x,G,z)||get(x,G,z))continue;const hh=h3(x,11,z);if(hh<0.5*(1-d)+0.05)put(x,G-1,z,pick(pal,x,6,z),0.1);if(hh>0.975)put(x,G,z,pick(pal,x,8,z),0.1);}}
function blob(cx,cy,cz,rx,ry,rz,pal,holes=0.15){for(let dy=-Math.ceil(ry);dy<=Math.ceil(ry);dy++)for(let dz=-Math.ceil(rz);dz<=Math.ceil(rz);dz++)for(let dx=-Math.ceil(rx);dx<=Math.ceil(rx);dx++){
  const x=cx+dx,y=cy+dy,z=cz+dz,d=(dx/rx)**2+(dy/ry)**2+(dz/rz)**2;if(d>1+(h3(x,y,z)-.5)*.5)continue;if(d>.45&&h3(x+9,y,z+4)<holes)continue;if(SE.bare&&pal.tree){if(h3(x+5,y+3,z+1)<0.8)continue;putE(x,y,z,pick(BARE,x,y,z),0.1);continue;}putE(x,y,z,pick(pal,x,y,z),0.1);}}
function trunk(x,z,h,c,t=1){for(let y=G;y<G+h;y++)for(let a=0;a<t;a++)for(let b=0;b<t;b++)put(x+a,y,z+b,c,0.1);}
function birch(x,z,h){for(let y=G;y<G+h;y++)put(x,y,z,h3(x,y,z)<0.22?0x3A3632:0xEDEAE0,0.04);
  for(let i=0;i<4;i++)blob(x+Math.round(rnd()*4-2),G+h-2+Math.round(rnd()*4),z+Math.round(rnd()*4-2),3.1+rnd()*1.3,2.7+rnd(),3.1+rnd()*1.3,Y,0.3);litter(x,z,7,Y);}
function maple(x,z,h,pal,r=5){r*=1.2;trunk(x,z,h,0x5B3E2B,r>4.5?2:1);blob(x,G+h+2,z,r,r*.8,r,pal,0.18);
  for(let i=0;i<3;i++)blob(x+Math.round(rnd()*6-3),G+h+Math.round(rnd()*3),z+Math.round(rnd()*6-3),r*.6,r*.5,r*.6,pal,0.2);litter(x,z,Math.round(r*1.8),pal);}
function poplar(x,z,h){trunk(x,z,Math.round(h*.35),0x6E5B48);blob(x,G+Math.round(h*.58),z,2.4,h*.46,2.4,POP,0.2);litter(x,z,5,POP);}
function conifer(x,z,h,pal,rb=3.6){const bare=SE.bare&&pal!==SPR;trunk(x,z,h-2,0x5A4332);for(let y=G+3;y<G+h;y++){const k=(y-G-3)/(h-3);let r=(1-k)*rb+.6;if((y-G)%3===0)r*=.6;
  const ri=Math.ceil(r);for(let dz=-ri;dz<=ri;dz++)for(let dx=-ri;dx<=ri;dx++)if(dx*dx+dz*dz<=r*r&&h3(x+dx,y,z+dz)>(bare?0.78:0.12))putE(x+dx,y,z+dz,pick(bare?BARE:pal,x+dx,y,z+dz),0.1);}
  put(x,G+h,z,bare?BARE[0]:pal[0],0.1);if(pal===LAR)litter(x,z,5,LAR);}
function bush(x,z,pal,r=1.7){blob(x,G+1,z,r,r*.9,r,pal,0.15);}
function fence(x1,z1,x2,z2,h,c){const n=Math.max(Math.abs(x2-x1),Math.abs(z2-z1)),sx=Math.sign(x2-x1),sz=Math.sign(z2-z1);
  for(let i=0;i<=n;i++){const x=x1+sx*i,z=z1+sz*i;if(get(x,G,z))continue;const post=i%6===0;for(let y=0;y<h+(post?1:0);y++)put(x,G+y,z,post?shade(c,.75):c,0.08);}}
function car(x,z,ax,col){for(let l=0;l<9;l++)for(let w=0;w<4;w++){const px=ax==='x'?x+l:x+w,pz=ax==='x'?z+w:z+l,side=w===0||w===3;
  put(px,G,pz,side&&(l===1||l===2||l===6||l===7)?0x1C1C1E:shade(col,.8),0.04);
  let c=col;if(l===0&&side)c=0xFFF2B0;if(l===8&&side)c=0xB02020;put(px,G+1,pz,c,0.03);
  if(l>=2&&l<=6)put(px,G+2,pz,(side||l===2||l===6)?0x263340:col,0.03);}}
function lamp(x,z,dx=1,dz=0){for(let y=G;y<G+12;y++)put(x,y,z,0x3E4248,0.03);put(x+dx,G+11,z+dz,0x3E4248,0.03);put(x+2*dx,G+11,z+2*dz,0x3E4248,0.03);put(x+2*dx,G+10,z+2*dz,0xFFE2A0,0.02,2);lamps.push([x+2*dx,G+10,z+2*dz]);}
function bench(x,z,ax){for(let i=0;i<3;i++){const px=ax==='x'?x+i:x,pz=ax==='x'?z:z+i;put(px,G,pz,i===1?0x7A5A3C:0x3E3E42,0.05);if(i!==1)put(px,G,pz,0x8A6543,0.05);}}
function person(x,z,shirt,tall=3){put(x,G,z,0x2E3440,0.05);for(let y=1;y<tall;y++)put(x,G+y,z,shirt,0.05);put(x,G+tall,z,0xE8B894,0.03);}

// окна
function win(x,y,z,lit){if(lit)put(x,y,z,0xFFD98A,0.06,2);else put(x,y,z,0x3B4C63,0.1);}
// крыша по карте высот из нескольких скатных частей
function roof(parts,yB,color,o={}){const ov=o.ov??1,sl=o.slope||2;let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const p of parts){a=Math.min(a,p.x1-ov);b=Math.max(b,p.x2+ov);c=Math.min(c,p.z1-ov);d=Math.max(d,p.z2+ov);}
